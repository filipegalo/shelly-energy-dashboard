services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shelly
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: shelly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelly -d shelly"]
      interval: 2s
      timeout: 3s
      retries: 20

  unpack-source:
    build:
      context: .
      dockerfile: Dockerfile.migration-test-source
    volumes:
      - migration-source:/source
    healthcheck:
      test: ["CMD-SHELL", "test -f /source/.ready"]
      interval: 1s
      timeout: 2s
      retries: 10

  migrate:
    build: .
    entrypoint: ["/usr/local/bin/migrate-sqlite-to-postgres"]
    command: ["--source", "/source/data/shelly-inventory.db"]
    environment:
      DATABASE_USERNAME: shelly
      DATABASE_PASSWORD: test-password
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: shelly
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
      unpack-source:
        condition: service_healthy
    volumes:
      - migration-source:/source:ro

  app:
    build: .
    ports:
      - "${POSTGRES_TEST_PUBLISHED_ADDRESS:-127.0.0.1}:8081:8080"
    environment:
      APP_LISTEN_ADDRESS: 0.0.0.0:8080
      # Use the original key to read credential profiles migrated from SQLite.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DATABASE_USERNAME: shelly
      DATABASE_PASSWORD: test-password
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: shelly
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  migration-source:
